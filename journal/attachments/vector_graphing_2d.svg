<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="2D vector graphing example">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="currentColor"/>
    </marker>
    <style>
      .bg{fill:#ffffff}
      .grid{stroke:#e6e6e6;stroke-width:1}
      .axis{stroke:#111827;stroke-width:2}
      .label{fill:#111827;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; font-size:16px}
      .sub{fill:#374151;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; font-size:14px}
      .vec{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .compx{stroke:#dc2626;stroke-width:3;fill:none;marker-end:url(#arrow);stroke-dasharray:6 6}
      .compy{stroke:#16a34a;stroke-width:3;fill:none;marker-end:url(#arrow);stroke-dasharray:6 6}
      .pt{fill:#111827}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="720" height="420"/>

  <!-- Coordinate setup -->
  <!-- Origin -->
  <!-- O = (90,330), scale = 50 px/unit -->
  <!-- Grid -->
  <g>
    <line class="grid" x1="90" y1="30" x2="90" y2="380"/>
    <line class="grid" x1="140" y1="30" x2="140" y2="380"/>
    <line class="grid" x1="190" y1="30" x2="190" y2="380"/>
    <line class="grid" x1="240" y1="30" x2="240" y2="380"/>
    <line class="grid" x1="290" y1="30" x2="290" y2="380"/>
    <line class="grid" x1="340" y1="30" x2="340" y2="380"/>
    <line class="grid" x1="390" y1="30" x2="390" y2="380"/>
    <line class="grid" x1="440" y1="30" x2="440" y2="380"/>
    <line class="grid" x1="490" y1="30" x2="490" y2="380"/>
    <line class="grid" x1="540" y1="30" x2="540" y2="380"/>
    <line class="grid" x1="590" y1="30" x2="590" y2="380"/>
    <line class="grid" x1="640" y1="30" x2="640" y2="380"/>
    <line class="grid" x1="690" y1="30" x2="690" y2="380"/>

    <line class="grid" x1="40" y1="330" x2="700" y2="330"/>
    <line class="grid" x1="40" y1="280" x2="700" y2="280"/>
    <line class="grid" x1="40" y1="230" x2="700" y2="230"/>
    <line class="grid" x1="40" y1="180" x2="700" y2="180"/>
    <line class="grid" x1="40" y1="130" x2="700" y2="130"/>
    <line class="grid" x1="40" y1="80" x2="700" y2="80"/>
    <line class="grid" x1="40" y1="30" x2="700" y2="30"/>
    <line class="grid" x1="40" y1="380" x2="700" y2="380"/>
  </g>

  <!-- Axes -->
  <g style="color:#111827">
    <line class="axis" x1="40" y1="330" x2="700" y2="330" marker-end="url(#arrow)"/>
    <line class="axis" x1="90" y1="380" x2="90" y2="30" marker-end="url(#arrow)"/>
  </g>

  <!-- Tick labels -->
  <g>
    <text class="sub" x="694" y="352">x</text>
    <text class="sub" x="70" y="40">y</text>

    <text class="sub" x="86" y="352">0</text>
    <text class="sub" x="136" y="352">1</text>
    <text class="sub" x="186" y="352">2</text>
    <text class="sub" x="236" y="352">3</text>
    <text class="sub" x="286" y="352">4</text>
    <text class="sub" x="336" y="352">5</text>
    <text class="sub" x="386" y="352">6</text>

    <text class="sub" x="62" y="334">0</text>
    <text class="sub" x="62" y="284">1</text>
    <text class="sub" x="62" y="234">2</text>
    <text class="sub" x="62" y="184">3</text>
    <text class="sub" x="62" y="134">4</text>
    <text class="sub" x="62" y="84">5</text>
  </g>

  <!-- Vector v = <4,2> from origin -->
  <!-- Head H = (90+4*50, 330-2*50) = (290,230) -->
  <g style="color:#2563eb">
    <path class="vec" d="M90 330 L290 230"/>
  </g>

  <!-- Components (dashed) -->
  <g style="color:#dc2626">
    <path class="compx" d="M90 330 L290 330"/>
  </g>
  <g style="color:#16a34a">
    <path class="compy" d="M290 330 L290 230"/>
  </g>

  <!-- Points and labels -->
  <circle class="pt" cx="90" cy="330" r="4"/>
  <circle class="pt" cx="290" cy="230" r="4"/>
  <text class="label" x="302" y="225">H(4,2)</text>
  <text class="label" x="212" y="250">v</text>
  <text class="sub" x="178" y="322">v<tspan baseline-shift="sub" font-size="12">x</tspan>=4</text>
  <text class="sub" x="298" y="286">v<tspan baseline-shift="sub" font-size="12">y</tspan>=2</text>

  <text class="sub" x="40" y="410">Tip: place the tail at the origin, then move right v_x and up v_y.</text>
</svg>
